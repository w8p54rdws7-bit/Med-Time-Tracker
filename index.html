<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Med Time Tracker</title>
  <meta name="description" content="Medication timers and dose history, synced across all your devices.">
  <meta name="theme-color" content="#4f6df5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#12141a" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Meds">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app" class="app">
    <div class="boot-splash">
      <div class="boot-splash__logo" aria-hidden="true">⏱️</div>
      <div class="boot-splash__text">Med Time Tracker</div>
    </div>
  </div>
  <div id="toast-root"></div>
  <noscript>
    <div style="padding:2rem;text-align:center;font-family:system-ui;">
      Med Time Tracker needs JavaScript to run. Please enable it and reload.
    </div>
  </noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
